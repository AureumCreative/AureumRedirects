
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">

    <title>The Wasteland Spy — GoldAnnie / Aureum</title>

    <style>
        body {
            font-family: Georgia, serif;
            color: #3b2a00;

            background-image: url("../background.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;

            min-height: 100vh;
            margin: 0;
            padding: 100px 20px;
            box-sizing: border-box;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 252, 240, 0.92);
            max-width: 600px;
            width: 100%;
            padding: 45px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 10px;
        }

        .names {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 30px;
            background: #3b2a00;
            color: #fff8dc;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.85;
        }

        a:focus-visible {
            outline: 3px solid #a47a19;
            outline-offset: 4px;
        }

        @media (max-width: 480px) {
            body {
                padding: 40px 16px;
            }

            .card {
                padding: 35px 22px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>
    <main class="card">

        <h1>The Wasteland Spy</h1>

        <div class="names">

        </div>

        <p>
            on Ko-fi:
        </p>

        <a
            href="https://ko-fi.com/s/d5e0120881"
            referrerpolicy="no-referrer"
            rel="noreferrer"
        >
            Continue to Purchase
        </a>

    </main>
</body>
</html>
